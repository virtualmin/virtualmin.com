<div class="install-command" data-bundle="LAMP" data-minimal="0" data-grade="A" data-ssl="1" data-tool="curl">
    <div class="install-command__options" role="group" aria-label="Installation options">
        <div class="install-command__pair" role="group" aria-label="Web server bundle">
            <button type="button" class="install-command__option" data-group="bundle" data-value="LAMP" aria-pressed="true" title="Install the LAMP bundle with Apache web server">LAMP <span class="install-command__option-note">Apache</span></button>
            <button type="button" class="install-command__option" data-group="bundle" data-value="LEMP" aria-pressed="false" title="Install the LEMP bundle with Nginx web server">LEMP <span class="install-command__option-note">Nginx</span></button>
        </div>
        <button type="button" class="install-command__option" data-group="minimal" data-value="1" aria-pressed="false" title="Install a minimal set of packages for the selected bundle">Minimal</button>
        <button type="button" class="install-command__option" data-group="ssl" data-value="1" aria-pressed="true" title="Request an SSL certificate for the hostname during installation">Host SSL</button>
        <div class="install-command__group">
            <div class="install-command__pair" role="group" aria-label="Operating system support grade">
                <button type="button" class="install-command__option" data-group="grade" data-value="A" aria-pressed="true" title="Install only on grade A supported operating systems">Grade A</button>
                <button type="button" class="install-command__option" data-group="grade" data-value="B" aria-pressed="false" title="Allow installation on grade B supported operating systems">Grade B</button>
            </div>
            <a class="install-command__docs" href="/docs/installation/automated/#install-script-flags" title="Learn about installation script flags" aria-label="Installation script flags documentation"><i class="wm wm-fw wm-question"></i></a>
        </div>
    </div>
    <div class="install-command__scroll">
        <button type="button" class="install-command__copy" aria-label="Copy install command" title="Copy install command" data-copy-label="copy" data-copied-label="copied!">copy</button>
        <pre class="install-command__command">sudo sh -c "$(curl -fsSL https://download.virtualmin.com/virtualmin-install)" -- --bundle LAMP</pre>
    </div>
</div>
